[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/DeadlyGoonman/shifter-vst3"

[workspace.dependencies]
soundcraft-dsp = { path = "crates/dsp" }
soundcraft-vst3-host = { path = "crates/vst3-host" }
soundcraft-editor-scale = { path = "crates/editor-scale" }
bentsignal-ui = { path = "crates/bentsignal-ui" }

thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
